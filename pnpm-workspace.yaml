# Not a monorepo — this file exists only so pnpm can record which native
# dependency build-scripts are approved. `packages: ["."]` (this dir as the
# sole package) keeps it valid on the pnpm 9 that Railway uses, which rejects
# both a missing field AND an empty array with "packages field missing or empty".
packages:
  - "."
allowBuilds:
  bufferutil: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
