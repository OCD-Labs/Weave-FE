# Not a monorepo — this file exists only so pnpm can record which native
# dependency build-scripts are approved. `packages: []` keeps it valid on the
# pnpm 9 that Railway uses (lockfileVersion 9), which requires the field.
packages: []
allowBuilds:
  bufferutil: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
